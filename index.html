<html>
<head>
  <title>Todo List</title>
  <style>
    body {
      font-family: Arial;
    }
    .addbutton {
      background-color: green;
      color: white;
      border: none;
      font-size: 15px;
      cursor: pointer;
      padding: 8px 12px;
    }
    .removebutton {
      background-color: crimson;
      color: white;
      border: none;
      font-size: 13px;
      cursor: pointer;
      padding: 6px 10px;
    }
    .todogrid, .todogrid-input {
      display: grid;
      grid-template-columns: 300px 100px;
      column-gap: 10px;
      row-gap: 10px;
      align-items: center;
    }
    .todogrid-input {
      margin-bottom: 20px;
    }
    .nameinp {
      font-size: 15px;
      padding: 6px;
    }
  </style>
</head>
<body>
  <p>Write Rohit Birthday Song lyrics!</p>
  <div class="todogrid-input">
    <input class="js-input1 nameinp" placeholder="Enter " />
    <button class="addbutton" onclick="addtodo()">Add</button>
  </div>
  <div class="js-display"></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, orderBy, query, serverTimestamp, onSnapshot, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAqpLTMf5CLwbMWAdqZ-dS66onqBz5tmwY",
      authDomain: "todo-test-e8e2e.firebaseapp.com",
      projectId: "todo-test-e8e2e",
      storageBucket: "todo-test-e8e2e.appspot.com",
      messagingSenderId: "54252991944",
      appId: "1:54252991944:web:01165f0f64af846710bcfd",
      measurementId: "G-M6Q8GW4PY1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let hiddenIds = new Set();

    window.addtodo = async function () {
      const name = document.querySelector(".js-input1").value.trim();
      if (!name) {
        alert("Please enter a todo item.");
        return;
      }
      try {
        await addDoc(collection(db, "todos"), {
          name,
          timestamp: serverTimestamp()
        });
        document.querySelector(".js-input1").value = "";
      } catch (e) {
        alert("Error adding todo: " + e.message);
      }
    };

    // Writes the hidden ID to a separate "hidden_todos" collection in Firestore
    window.hideRow = async function (id) {
      try {
        await setDoc(doc(db, "hidden_todos", id), { hiddenAt: serverTimestamp() });
        // onSnapshot on hidden_todos will automatically re-render
      } catch (e) {
        alert("Error hiding todo: " + e.message);
      }
    };

    function renderTodoList(todos) {
      const display = document.querySelector(".js-display");
      let html = '';
      todos.forEach(({ id, data }) => {
        if (hiddenIds.has(id)) return;
        html += `
          <div class="todogrid" data-id="${id}">
            <div>${data.name}</div>
            <button class="removebutton" onclick="hideRow('${id}')">Remove</button>
          </div>
        `;
      });
      display.innerHTML = html;
    }

    let latestTodos = [];

    // Listen to todos
    const todosQuery = query(collection(db, "todos"), orderBy("timestamp"));
    onSnapshot(todosQuery, (snapshot) => {
      latestTodos = snapshot.docs.map(d => ({ id: d.id, data: d.data() }));
      renderTodoList(latestTodos);
    });

    // Listen to hidden_todos — re-render whenever something is hidden
    onSnapshot(collection(db, "hidden_todos"), (snapshot) => {
      hiddenIds = new Set(snapshot.docs.map(d => d.id));
      renderTodoList(latestTodos);
    });

  </script>
</body>
</html>
