<html>
<head>
  <title>Todo List</title>
  <style>
    body {
      font-family: Arial;
    }
    .addbutton {
      background-color: green;
      color: white;
      border: none;
      font-size: 15px;
      cursor: pointer;
      padding: 8px 12px;
    }
    .removebutton {
      background-color: crimson;
      color: white;
      border: none;
      font-size: 13px;
      cursor: pointer;
      padding: 6px 10px;
    }
    .todogrid, .todogrid-input {
      display: grid;
      grid-template-columns: 300px 100px;
      column-gap: 10px;
      row-gap: 10px;
      align-items: center;
    }
    .todogrid-input {
      margin-bottom: 20px;
    }
    .nameinp {
      font-size: 15px;
      padding: 6px;
    }
  </style>
</head>
<body>
  <p>Write Rohit Birthday Song lyrics!</p>
  <div class="todogrid-input">
    <input class="js-input1 nameinp" placeholder="Enter " />
    <button class="addbutton" onclick="addtodo()">Add</button>
  </div>
  <div class="js-display"></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, orderBy, query, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAqpLTMf5CLwbMWAdqZ-dS66onqBz5tmwY",
      authDomain: "todo-test-e8e2e.firebaseapp.com",
      projectId: "todo-test-e8e2e",
      storageBucket: "todo-test-e8e2e.appspot.com",
      messagingSenderId: "54252991944",
      appId: "1:54252991944:web:01165f0f64af846710bcfd",
      measurementId: "G-M6Q8GW4PY1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Tracks IDs hidden by the user this session (in-memory only)
    const hiddenIds = new Set();

    window.addtodo = async function () {
      const name = document.querySelector(".js-input1").value.trim();
      if (!name) {
        alert("Please enter a todo item.");
        return;
      }
      try {
        await addDoc(collection(db, "todos"), {
          name,
          timestamp: serverTimestamp()
        });
        document.querySelector(".js-input1").value = "";
      } catch (e) {
        alert("Error adding todo: " + e.message);
      }
    };

    window.hideRow = function (id) {
      hiddenIds.add(id);
      const row = document.querySelector(`[data-id="${id}"]`);
      if (row) row.remove();
    };

    function renderTodoList() {
      const q = query(collection(db, "todos"), orderBy("timestamp"));
      onSnapshot(q, (snapshot) => {
        const display = document.querySelector(".js-display");
        let html = '';
        snapshot.forEach(docSnap => {
          if (hiddenIds.has(docSnap.id)) return; // skip hidden rows
          const data = docSnap.data();
          html += `
            <div class="todogrid" data-id="${docSnap.id}">
              <div>${data.name}</div>
              <button class="removebutton" onclick="hideRow('${docSnap.id}')">Remove</button>
            </div>
          `;
        });
        display.innerHTML = html;
      });
    }

    renderTodoList();
  </script>
</body>
</html>
